<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- routing fan-out: single ingress splitting to three upstream models -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.95">
    <path d="M46 128 H92"/>
    <path d="M92 128 C130 128 132 66 172 66"/>
    <path d="M92 128 H172"/>
    <path d="M92 128 C130 128 132 190 172 190"/>
  </g>

  <!-- ingress node -->
  <circle cx="46" cy="128" r="15" fill="#ffffff"/>

  <!-- upstream model nodes -->
  <g fill="#ffffff">
    <rect x="176" y="52" width="30" height="28" rx="9"/>
    <rect x="176" y="114" width="30" height="28" rx="9"/>
    <rect x="176" y="176" width="30" height="28" rx="9"/>
  </g>

  <!-- pay-per-call token at the routing junction -->
  <circle cx="92" cy="128" r="27" fill="url(#coin)" stroke="#ffffff" stroke-width="7"/>
  <g fill="none" stroke="#7c2d12" stroke-width="7" stroke-linecap="round">
    <path d="M92 112 V144"/>
    <path d="M82 119 C82 112 102 112 102 121 C102 130 82 128 82 137 C82 146 102 146 102 139"/>
  </g>
</svg>
